# Это имя твоей кнопки
name: 'Запустить генерацию видео'

# Эта команда говорит GitHub: "Сделай мне кнопку в интерфейсе"
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Что генерируем?'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем твой код с Kaggle
      - name: Получить ноутбук
        uses: actions/checkout@v4
      
      # 2. Учим GitHub говорить с Kaggle
      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Установка соединения с Kaggle
        run: pip install kaggle
        
      # 3. Отправляем команду на завод (Kaggle)
      - name: Запуск станка
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: kaggle kernels push -p ./notebook

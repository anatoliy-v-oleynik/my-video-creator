# Это имя твоей кнопки
name: '2.Запустить генерацию видео'

# Эта команда говорит GitHub: "Сделай мне кнопку в интерфейсе"
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Что генерируем?'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем твой код из репозитория
      - name: Получить репозиторий
        uses: actions/checkout@v4
      
      # 2. Учим GitHub говорить с Kaggle (Безопасный способ)
      - name: Настройка Kaggle API
        env:
          KAGGLE_SECRET_DATA: ${{ secrets.KAGGLE_JSON }}
        run: |
          mkdir -p ~/.kaggle
          # Записываем переменную окружения напрямую в файл без использования echo
          printf "%s" "$KAGGLE_SECRET_DATA" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          pip install kaggle
          
      # 3. Отправляем команду на завод (Kaggle)
      - name: Запуск генерации на Kaggle
        run: |
          # Проверяем, что папка notebook существует
          if [ -d "./video_generation_job" ]; then
            echo "Папка video_generation_job найдена, запускаю..."
            kaggle kernels push -p ./video_generation_job
          else
            echo "❌ Ошибка: папка 'video_generation_job' не найдена!"
            echo "Создай папку 'video_generation_job' и положи туда твой .ipynb файл"
            exit 1
          fi
